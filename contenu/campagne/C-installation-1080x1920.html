<!doctype html><html lang="fr"><head><meta charset="utf-8"><style>
@font-face{font-family:"Outfit";font-weight:100 900;src:url(../../site/assets/fonts/outfit-latin-wght.woff2) format("woff2")}
@font-face{font-family:"Outfit";font-weight:100 900;src:url(../../site/assets/fonts/outfit-latin-ext-wght.woff2) format("woff2");unicode-range:U+0100-02BA,U+1E00-1EFF,U+20A0-20C0}
:root{--bleu:#0041B9;--dore:#F6D9A8;--corail:#F2735F;--u:1.0px}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;overflow:hidden;font-family:"Outfit",sans-serif;background:var(--bleu);color:#fff;display:flex;flex-direction:column;padding:calc(150*var(--u)) 0 calc(230*var(--u))}
.bande{flex:none;height:calc(96*var(--u));display:flex;align-items:center;justify-content:space-between;padding:0 calc(56*var(--u))}
.marque{display:flex;align-items:center;gap:calc(16*var(--u))}
.marque .o{height:calc(52*var(--u))} .marque .n{height:calc(17*var(--u))}
.bande .lieu{font-size:calc(19*var(--u));font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dore)}
.liseret{flex:none;height:calc(14*var(--u));background:repeating-linear-gradient(90deg,var(--bleu) 0 calc(34*var(--u)),#fff calc(34*var(--u)) calc(68*var(--u)))}
.scene{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.photo{position:relative;flex:1 1 auto;min-height:0;min-width:0}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
h1{font-weight:600;font-size:calc(64*var(--u));line-height:1.05;letter-spacing:-.02em;text-wrap:balance}
.photo h1{position:absolute;left:calc(56*var(--u));right:calc(56*var(--u));top:calc(46*var(--u));text-shadow:0 calc(2*var(--u)) calc(18*var(--u)) rgba(0,40,120,.35)}
.texte h1{margin-bottom:calc(30*var(--u))}
h1 span{display:block;color:var(--dore)}
h1 small{display:inline-block;font-size:calc(26*var(--u));font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--bleu);padding:calc(10*var(--u)) calc(18*var(--u));margin-bottom:calc(22*var(--u));text-shadow:none}
.texte h1 small{background:var(--corail)}
.texte{flex:none;padding:calc(44*var(--u)) calc(56*var(--u)) calc(40*var(--u))}
.preuve{font-size:calc(38*var(--u));font-weight:600;line-height:1.15;text-wrap:balance;margin-bottom:calc(10*var(--u))}
.repere{font-size:calc(34*var(--u));font-weight:500;color:var(--dore);margin-bottom:calc(24*var(--u))}
.rh{font-size:calc(28*var(--u));font-weight:600;margin:calc(-4*var(--u)) 0 calc(24*var(--u))}
.bas{display:flex;align-items:center;justify-content:space-between;gap:calc(24*var(--u))}
.action{background:var(--corail);color:#fff;font-weight:700;font-size:calc(28*var(--u));letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;padding:calc(18*var(--u)) calc(30*var(--u))}
.site{font-size:calc(28*var(--u));font-weight:600;text-align:right}
.mention{margin-top:calc(20*var(--u));font-size:calc(21*var(--u));line-height:1.35;opacity:.85}
</style></head><body>
<div class="bande"><div class="marque"><img class="o" src="img/logo-oiseau-blanc.svg" alt=""><img class="n" src="img/logo-nom-blanc.svg" alt="Les Piafs des Collines"></div><span class="lieu">Nice Bellet</span></div>
<div class="liseret"></div>
<div class="scene"><div class="photo"><img src="img/sejour.jpg" alt=""></div>
<div class="texte">
  <h1><small>Location en bail mobilité</small><br>En déplacement.<span>Pas entre deux valises.</span></h1>
  <p class="preuve">Un appartement entier, meublé et équipé, à Nice Bellet</p>
  <p class="repere">77 m² · De 1 à 10 mois</p>
  
  <div class="bas"><span class="action">Vérifiez vos dates</span><span class="site">lespiafsdescollines.com</span></div>
  <p class="mention">Bail mobilité sous conditions d'éligibilité et de disponibilité</p>
</div></div>
</body></html>
